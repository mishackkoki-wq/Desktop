<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Campus SportTrack - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="text-center">Welcome Back</h2>
        <p class="text-center">Login to continue to Campus SportTrack</p>
        <form method="POST" class="mx-auto" style="max-width:400px;">
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <div class="mb-3">
                <label>Email / Student Number</label>
                <input type="text" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <p class="mt-3 text-center"><a href="#">Forgot Password?</a></p>
            <p class="text-center">Don't have an account? <a href="#">Register Here</a></p>
        </form>
    </div>
</body>
</html>
